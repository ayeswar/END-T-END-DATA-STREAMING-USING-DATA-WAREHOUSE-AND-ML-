version: '3.8'

services:
  # --- Messaging (Kafka) ---
  zookeeper:
    image: bitnamilegacy/zookeeper:3.8.1
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka:
    image: bitnamilegacy/kafka:3.4.1
    depends_on:
      - zookeeper
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_ANONYMOUS_LOGIN=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
    ports:
      - "9092:9092"
      - "9094:9094"

  # --- Data Warehouse & Feature Store ---
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=warehouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  # --- ML Lifecycle (MLflow) ---
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./artifacts
    volumes:
      - ./mlflow:/mlflow

  # --- Processing (Spark) ---
  spark-master:
    image: bitnamilegacy/spark:3.4.1
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker:
    image: bitnamilegacy/spark:3.4.1
    depends_on:
      - spark-master



    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    ports:
      - "8081:8081"

  # --- Orchestration (Airflow) ---
  # Simplified for demo; usually requires multiple services
  airflow:
    image: apache/airflow:2.7.1
    depends_on:
      - postgres
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:password@postgres/warehouse
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    ports:
      - "8082:8080"
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
    command: standalone

  # --- Serving & Dashboard ---
  serving:
    build:
      context: .
      dockerfile: ./serving/Dockerfile
    depends_on:
      - postgres
      - redis
      - mlflow
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - REDIS_HOST=redis
      - DB_URL=postgresql://admin:password@postgres/warehouse

  dashboard:
    build:
      context: .
      dockerfile: ./dashboard/Dockerfile
    depends_on:
      - serving
      - postgres
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=postgres
      - API_HOST=serving


  # --- Data Flow (Automation) ---
  producer:
    build:
      context: .
      dockerfile: ./ingestion/Dockerfile
    depends_on:
      - kafka

  streamer:
    build:
      context: .
      dockerfile: ./processing/Dockerfile
    depends_on:
      - kafka
      - postgres
      - redis

volumes:
  postgres_data:


